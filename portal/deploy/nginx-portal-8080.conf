# Portal Globaltech ACS — porta própria, não interfere nos outros sites
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1m;
    access_log /var/log/nginx/globaltech-portal.access.log;
    error_log /var/log/nginx/globaltech-portal.error.log;

    # Upload do teste de velocidade (TR-143): o roteador envia 100 MB por HTTP PUT
    location /speedtest/upload/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        access_log /var/log/nginx/globaltech-speedtest.log;
    }

    # Envio de arquivo de firmware (até 300 MB), repassado direto ao GenieACS
    location = /api/firmware/upload {
        client_max_body_size 310m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
